<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/output.css">
    <title>Document</title>
</head>

<body>
    <!-- gif  -->
    <div class="w-full h-17.5">
        <figure class=" h-full object-cover flex justify-center *:h-full *:object-cover">
            <img src="assets/img/head/top head.gif" alt="">
        </figure>
    </div>
    <!-- gif -->

    <!-- start top head -->
    <div class="w-full h-17.5 bg_head flex items-center justify-between px-2 2xl:px-7">
        <span class="md:hidden"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="white" class="size-8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </span>
        <ul class="h-full w-200 items-center justify-between gap-5 hidden md:flex  *:text-white *:text-xl *:flex">
            <li class="hover:text-blue-700"><a href="">جستجو</a></li>
            <li class="hover:text-blue-700"><a href="">حساب کاربری</a></li>
            <li class="hover:text-blue-700"><a href="">ولاگ</a></li>
            <li class="hover:text-blue-700"><a href="">ارتباط با ما</a></li>
            <li class="hover:text-blue-700"><a href="">خدمات پس از فروش</a></li>
            <li class="group hover:text-blue-700"><span
                    class="group-hover:fill-blue-500 inline-block align-middle mt-2 mx-0.5"><svg
                        xmlns="http://www.w3.org/2000/svg" fill="group-hover:stroke-blue-500" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="white" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                    </svg>
                </span><a href="">محصولات</a></li>
        </ul>
        <div class="w-38 h-full">
            <figure class=" h-full object-cover  *:h-full *:object-cover">
                <img src="assets/img/head/logo.png" alt="">
            </figure>
        </div>
    </div>
    <!-- end top head -->


    <!-- start head  -->

    <section
        class="w-full h-50 relative md:h-dvh *:absolute *:top-0 *:left-0 *:rounded-[10px] *:overflow-hidden *:px-1.5 *:py-1.5">
        <img class="animeimg1" src="assets/img/head/head1.jpg" alt="">
        <img class="animeimg2" src="assets/img/head/head2.jpg" alt="">
        <img class="animeimg3" src="assets/img/head/head3.jpg" alt="">
    </section>

    <!-- end head  -->

    <!-- start bottom head  -->

    <div class="w-full h-35 md:h-90  mb-3 px-5 py-5 *:rounded-[10px] *:overflow-hidden">
        <img src="assets/img/head/botton head.jpg" alt="">
    </div>

    <!-- end bottom head  -->

    <!-- start body  -->

    <section class="w-full h-auto px-1.5 py-2.5 flex flex-wrap mt-2 justify-between  gap-1.5 md:gap-3 md:mt-12 *:w-[49%] *:h-37.5 *:md:h-60">
        <div class="group relative">
            <img class="card" src="assets/img/body/baby.jpg" alt="">
            <a class="imglink" href="">محصولات کودک</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_5.jpg" alt="">
            <a class="imglink" href="">موتورسیکلت بنزینی</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_3.jpg" alt="">
            <a class="imglink" href="">موتورسیکلت برقی</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_Accesories.jpg" alt="">
            <a class="imglink" href="">اکسسوریز</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_Bicycle.jpg" alt="">
            <a class="imglink" href="">دوچرخه</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_4.jpg" alt="">
            <a class="imglink" href="">چهارچرخ</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_2 (1).jpg" alt="">
            <a class="imglink" href="">محصولات آبی</a>
        </div>
        <div class="group relative">
            <img class="card" src="assets/img/body/Categories_7.jpg" alt="">
            <a class="imglink" href="">ماشین برقی</a>
        </div>

    </section>
